<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Video panduan RACIK-LOKAL</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>html, body { margin: 0; background: #111; } canvas { display: block; }</style>
</head>
<body>
<canvas id="c" width="1280" height="720"></canvas>
<script>
// Video panduan: adegan dari tangkapan layar, teks bertahap, efek suara dari Web Audio.
// Dijalankan oleh rekam_video.cjs, yang memanggil window.MULAI(gambar) lalu menerima rekaman.
const W = 1280, H = 720;
const C = { accent: "#066867", soft: "#e6f1ef", ink: "#161616", muted: "#4a524f", subtle: "#6b7370", jingga: "#e8890c", canvas: "#f2f4f2" };
const SANS = '"IBM Plex Sans", system-ui, sans-serif';

const ADEGAN = [
  { jenis: "pembuka" },
  { img: "01-halaman-awal", tag: "Mulai", judul: "Buka RACIK-LOKAL", poin: ["Tekan Masuk di halaman awal"] },
  { img: "02-masuk", tag: "Mulai", judul: "Masuk ke akun Anda", poin: ["Isi surel dan kata sandi", "Atau pakai akun contoh"] },
  { img: "03-beranda", tag: "Beranda", judul: "Lanjutkan pekerjaan", poin: ["Pekerjaan terakhir selalu di atas", "Atau buat formula baru"] },
  { img: "04-formula-baru", tag: "Beranda", judul: "Formula baru", poin: ["Beri nama formula", "Pilih kelompok sasaran"], polos: true },
  { img: "05-sasaran", tag: "Langkah 1", judul: "Sasaran", poin: ["Pilih untuk siapa", "Isi berat satu sajian", "Isi biaya maksimal", "Tekan Lanjut ke Racik"] },
  { img: "06-racik-hasil", tag: "Langkah 2", judul: "Racik", poin: ["Posisi Anda di empat langkah", "Ringkasan zat gizi yang cukup"] },
  { img: "07-racik-takaran", tag: "Langkah 2", judul: "Gram dan takaran sendok", poin: ["14,0 g ≈ 1¾ sdm peres", "Foto membantu mengenali bahan"], catatan: "Takaran hanya perkiraan. Gizi dihitung dari gram." },
  { img: "08-racik-gizi", tag: "Langkah 2", judul: "Gizi per sajian", poin: ["Kurang? Baca sarannya, lalu racik ulang"] },
  { img: "10-cek-klaim", tag: "Langkah 3", judul: "Cek klaim", poin: ["Boleh dipakai di label", "Belum boleh, lengkap dengan saran"] },
  { img: "11-ajukan", tag: "Langkah 4", judul: "Ajukan", poin: ["Pilih klaim untuk label", "Klaim yang belum lolos terkunci", "Pilih ahli gizi", "Kirim ke peninjau"] },
  { img: "12-bahan-daftar", tag: "Bahan", judul: "Kenali bahan lewat fotonya", poin: ["Cari bahan", "Foto bentuk asli bahan"] },
  { img: "14-bahan-takaran", tag: "Bahan", judul: "Takaran rumah tangga", poin: ["Berat sendok dan gelas", "Kalkulator: 2 sdm peres ≈ 7,2 g"] },
  { img: "15-tinjau", tag: "Ahli gizi", judul: "Tinjau formula", poin: ["Setujui, minta revisi, atau tolak", "Tulis catatan", "Kirim keputusan"] },
  { img: "16-pilot", tag: "Koordinator", judul: "Pantau pilot", poin: ["Asupan zat besi terhadap target", "Peringatan hasil uji lab", "Ekspor CSV"] },
  { jenis: "penutup" },
];

// Lama tiap adegan (detik)
for (const a of ADEGAN) {
  a.durasi = a.jenis === "pembuka" ? 5.2 : a.jenis === "penutup" ? 6.5 : Math.max(5, 1.3 + (a.poin.length) * 1.05 + 2.2);
}
let t0 = 0;
for (const a of ADEGAN) { a.mulai = t0; t0 += a.durasi; }
const TOTAL = t0;

// ---------- Suara ----------
let ac, keluar;
function siapkanSuara() {
  ac = new AudioContext({ sampleRate: 48000 });
  keluar = ac.createMediaStreamDestination();
  const master = ac.createGain(); master.gain.value = 0.9;
  const comp = ac.createDynamicsCompressor();
  master.connect(comp); comp.connect(keluar); comp.connect(ac.destination);
  ac.master = master;
}
function nada(f, mulai, lama, { tipe = "sine", vol = 0.2, f2 = null, serang = 0.005 } = {}) {
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = tipe; o.frequency.setValueAtTime(f, mulai);
  if (f2) o.frequency.exponentialRampToValueAtTime(f2, mulai + lama);
  g.gain.setValueAtTime(0.0001, mulai);
  g.gain.exponentialRampToValueAtTime(vol, mulai + serang);
  g.gain.exponentialRampToValueAtTime(0.0001, mulai + lama);
  o.connect(g); g.connect(ac.master); o.start(mulai); o.stop(mulai + lama + 0.05);
}
function derau(lama) {
  const b = ac.createBuffer(1, Math.ceil(ac.sampleRate * lama), ac.sampleRate), d = b.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  const s = ac.createBufferSource(); s.buffer = b; return s;
}
const SFX = {
  whoosh(t) {
    const s = derau(0.6), f = ac.createBiquadFilter(), g = ac.createGain();
    f.type = "bandpass"; f.Q.value = 1.4;
    f.frequency.setValueAtTime(300, t); f.frequency.exponentialRampToValueAtTime(3200, t + 0.28); f.frequency.exponentialRampToValueAtTime(900, t + 0.55);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.32, t + 0.18); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.55);
    s.connect(f); f.connect(g); g.connect(ac.master); s.start(t); s.stop(t + 0.6);
  },
  pop(t, naik = 0) {
    const f = 660 * Math.pow(2, naik / 12);
    nada(f, t, 0.12, { vol: 0.22, f2: f * 1.5 });
    nada(f * 2, t + 0.01, 0.08, { vol: 0.05, tipe: "triangle" });
  },
  chime(t) {
    [659.25, 987.77, 1318.5].forEach((f, i) => nada(f, t + i * 0.09, 1.6, { vol: 0.12, serang: 0.01 }));
  },
  klik(t) {
    const s = derau(0.03), f = ac.createBiquadFilter(), g = ac.createGain();
    f.type = "highpass"; f.frequency.value = 2500; g.gain.value = 0.25;
    s.connect(f); f.connect(g); g.connect(ac.master); s.start(t); s.stop(t + 0.03);
  },
  sukses(t) {
    [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => nada(f, t + i * 0.11, 0.9, { vol: 0.13, tipe: "triangle", serang: 0.01 }));
  },
};
// Musik latar lembut: akor bergantian dengan filter rendah.
function musikLatar(mulai, lama) {
  const akor = [[261.63, 329.63, 392.0, 493.88], [220.0, 261.63, 329.63, 392.0], [174.61, 220.0, 261.63, 329.63], [196.0, 246.94, 293.66, 392.0]];
  const lp = ac.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 1100;
  const g = ac.createGain(); g.gain.value = 0.0001; lp.connect(g); g.connect(ac.master);
  g.gain.setValueAtTime(0.0001, mulai); g.gain.exponentialRampToValueAtTime(0.05, mulai + 2);
  g.gain.setValueAtTime(0.05, mulai + lama - 2.5); g.gain.exponentialRampToValueAtTime(0.0001, mulai + lama);
  const langkah = 4;
  for (let t = 0, i = 0; t < lama; t += langkah, i++) {
    for (const f of akor[i % akor.length]) {
      for (const det of [-4, 4]) {
        const o = ac.createOscillator(), e = ac.createGain();
        o.type = "triangle"; o.frequency.value = f; o.detune.value = det;
        e.gain.setValueAtTime(0.0001, mulai + t); e.gain.exponentialRampToValueAtTime(0.5, mulai + t + 1.2);
        e.gain.exponentialRampToValueAtTime(0.0001, mulai + t + langkah + 0.6);
        o.connect(e); e.connect(lp); o.start(mulai + t); o.stop(mulai + t + langkah + 0.7);
      }
    }
    // nada petik kecil di atas akor
    const atas = akor[i % akor.length];
    [0, 1, 2, 3].forEach((k) => nada(atas[(k + i) % 4] * 2, mulai + t + k * 1.0 + 0.5, 0.5, { vol: 0.025, tipe: "sine" }));
  }
}
function jadwalkanSuara(awal) {
  musikLatar(awal, TOTAL);
  for (const a of ADEGAN) {
    const t = awal + a.mulai;
    if (a.jenis === "pembuka") { SFX.chime(t + 0.2); [0, 1, 2, 3].forEach((k) => SFX.pop(t + 2.0 + k * 0.35, k * 2)); continue; }
    if (a.jenis === "penutup") { SFX.whoosh(t); SFX.sukses(t + 0.6); continue; }
    SFX.whoosh(t);
    SFX.klik(t + 0.75);
    a.poin.forEach((_, k) => SFX.pop(t + 1.3 + k * 1.05, k * 2));
  }
}

// ---------- Gambar ----------
const cv = document.getElementById("c"), x = cv.getContext("2d");
const IMG = {};
const ease = (v) => 1 - Math.pow(1 - Math.min(1, Math.max(0, v)), 3);
const fade = (t, a, b) => ease((t - a) / (b - a));

function rr(px, py, w, h, r) { x.beginPath(); x.roundRect(px, py, w, h, r); }
function teks(s, px, py, { size = 20, weight = 400, warna = C.ink, align = "left", font = SANS } = {}) {
  x.font = `${weight} ${size}px ${font}`; x.fillStyle = warna; x.textAlign = align; x.textBaseline = "alphabetic"; x.fillText(s, px, py);
}
function bungkus(s, maks, size, weight = 400) {
  x.font = `${weight} ${size}px ${SANS}`;
  const baris = []; let kini = "";
  for (const k of s.split(" ")) {
    const coba = kini ? kini + " " + k : k;
    if (x.measureText(coba).width > maks && kini) { baris.push(kini); kini = k; } else kini = coba;
  }
  if (kini) baris.push(kini);
  return baris;
}
function latar() {
  x.fillStyle = C.canvas; x.fillRect(0, 0, W, H);
  const g1 = x.createRadialGradient(1150, -40, 10, 1150, -40, 620); g1.addColorStop(0, "rgba(6,104,103,.16)"); g1.addColorStop(1, "rgba(6,104,103,0)");
  x.fillStyle = g1; x.fillRect(0, 0, W, H);
  const g2 = x.createRadialGradient(0, 760, 10, 0, 760, 520); g2.addColorStop(0, "rgba(94,160,72,.12)"); g2.addColorStop(1, "rgba(94,160,72,0)");
  x.fillStyle = g2; x.fillRect(0, 0, W, H);
}
function merek(px, py, ukuran = 30, alpha = 1) {
  x.globalAlpha = alpha;
  if (IMG.logo) x.drawImage(IMG.logo, px, py - ukuran + 4, ukuran, ukuran);
  teks("RACIK-", px + ukuran + 10, py, { size: ukuran * 0.6, weight: 700 });
  x.font = `700 ${ukuran * 0.6}px ${SANS}`;
  teks("LOKAL", px + ukuran + 10 + x.measureText("RACIK-").width, py, { size: ukuran * 0.6, weight: 700, warna: C.accent });
  x.globalAlpha = 1;
}
function pil(s, px, py, { bg = C.soft, warna = C.accent, size = 16 } = {}) {
  x.font = `600 ${size}px ${SANS}`;
  const w = x.measureText(s).width + 28;
  rr(px, py, w, size + 16, 999); x.fillStyle = bg; x.fill();
  teks(s, px + 14, py + size + 3, { size, weight: 600, warna });
  return w;
}
function bulatNo(n, cx, cy, r = 15, warna = C.jingga) {
  x.beginPath(); x.arc(cx, cy, r, 0, Math.PI * 2); x.fillStyle = warna; x.fill();
  teks(String(n), cx, cy + r * 0.4, { size: r * 1.1, weight: 700, warna: "#fff", align: "center" });
}

function adeganLayar(a, t) {
  const masuk = fade(t, 0, 0.55), keluar = 1 - fade(t, a.durasi - 0.35, a.durasi);
  const alpha = Math.min(masuk, keluar);
  x.save(); x.globalAlpha = alpha;
  // kepala
  merek(56, 66, 30);
  const geser = (1 - masuk) * 30;
  x.translate(geser, 0);
  pil(a.tag, 56, 92);
  teks(a.judul, 56, 168, { size: 38, weight: 600 });
  x.translate(-geser, 0);

  // tangkapan layar dengan zoom pelan
  const img = IMG[a.img];
  const bx = 56, by = 196, bw = 752, bh = 470;
  x.save();
  x.shadowColor = "rgba(16,40,38,.18)"; x.shadowBlur = 40; x.shadowOffsetY = 16;
  rr(bx, by, bw, bh, 18); x.fillStyle = "#fff"; x.fill();
  x.restore();
  x.save(); rr(bx, by, bw, bh, 18); x.clip();
  if (img) {
    const z = 1 + 0.045 * (t / a.durasi);
    const sw = img.width / z, sh = img.height / z;
    x.drawImage(img, (img.width - sw) / 2, (img.height - sh) / 2, sw, sh, bx, by, bw, bh);
  }
  x.restore();

  // poin di kanan
  let py = 250;
  const px = 850, lebar = 374;
  a.poin.forEach((p, k) => {
    const muncul = fade(t, 1.3 + k * 1.05, 1.3 + k * 1.05 + 0.35);
    if (muncul <= 0) return;
    const baris = bungkus(p, lebar - 46, 21, 500);
    const tinggi = baris.length * 28 + 26;
    x.save(); x.globalAlpha = alpha * muncul; x.translate((1 - muncul) * 24, 0);
    rr(px, py, lebar, tinggi, 16); x.fillStyle = "#fff"; x.shadowColor = "rgba(16,40,38,.08)"; x.shadowBlur = 18; x.shadowOffsetY = 4; x.fill(); x.shadowColor = "transparent";
    if (a.polos) { x.beginPath(); x.arc(px + 24, py + 27, 6, 0, Math.PI * 2); x.fillStyle = C.accent; x.fill(); }
    else bulatNo(k + 1, px + 26, py + 27, 14 * (0.6 + 0.4 * muncul));
    baris.forEach((b, i) => teks(b, px + 50, py + 34 + i * 28, { size: 21, weight: 500 }));
    x.restore();
    py += tinggi + 14;
  });
  if (a.catatan) {
    const m = fade(t, 1.3 + a.poin.length * 1.05 + 0.3, 1.3 + a.poin.length * 1.05 + 0.7);
    if (m > 0) {
      const baris = bungkus(a.catatan, lebar - 32, 17, 500);
      x.save(); x.globalAlpha = alpha * m;
      rr(px, py + 6, lebar, baris.length * 24 + 22, 14); x.fillStyle = "#f3ebdb"; x.fill();
      baris.forEach((b, i) => teks(b, px + 16, py + 34 + i * 24, { size: 17, weight: 500, warna: "#8a5a00" }));
      x.restore();
    }
  }
  x.restore();
}

function adeganPembuka(a, t) {
  const m = fade(t, 0.1, 0.9), k = 1 - fade(t, a.durasi - 0.4, a.durasi);
  x.save(); x.globalAlpha = Math.min(m, k);
  const s = 0.9 + 0.1 * m;
  if (IMG.logo) x.drawImage(IMG.logo, W / 2 - 48 * s, 150 - 48 * s + (1 - m) * 20, 96 * s, 96 * s);
  teks("Cara memakai", W / 2, 285, { size: 30, weight: 500, warna: C.muted, align: "center" });
  x.font = `700 64px ${SANS}`;
  const w1 = x.measureText("RACIK-").width, w2 = x.measureText("LOKAL").width, sx = W / 2 - (w1 + w2) / 2;
  teks("RACIK-", sx, 360, { size: 64, weight: 700 });
  teks("LOKAL", sx + w1, 360, { size: 64, weight: 700, warna: C.accent });
  teks("Racik camilan bergizi dari bahan lokal dalam empat langkah", W / 2, 412, { size: 22, warna: C.muted, align: "center" });
  const langkah = ["Sasaran", "Racik", "Cek klaim", "Ajukan"];
  x.font = `600 20px ${SANS}`;
  const lebar = langkah.map((l) => x.measureText(l).width + 70);
  let px = W / 2 - (lebar.reduce((p, q) => p + q, 0) + 16 * 3) / 2;
  langkah.forEach((l, i) => {
    const mm = fade(t, 2.0 + i * 0.35, 2.0 + i * 0.35 + 0.3);
    x.save(); x.globalAlpha = Math.min(m, k) * mm; x.translate(0, (1 - mm) * 16);
    rr(px, 470, lebar[i], 52, 999); x.fillStyle = "#fff"; x.shadowColor = "rgba(16,40,38,.1)"; x.shadowBlur = 16; x.fill(); x.shadowColor = "transparent";
    bulatNo(i + 1, px + 28, 496, 14, C.accent);
    teks(l, px + 52, 503, { size: 20, weight: 600 });
    x.restore();
    px += lebar[i] + 16;
  });
  x.restore();
}

function adeganPenutup(a, t) {
  const m = fade(t, 0.2, 0.9);
  x.save(); x.globalAlpha = m;
  merek(W / 2 - 110, 150, 44);
  teks("Siap meracik?", W / 2, 250, { size: 56, weight: 700, align: "center" });
  const poin = ["Masuk dengan akun contoh dari halaman awal", "Unduh panduan PDF untuk dibaca kapan saja", "Takaran sendok hanya perkiraan, timbang bila bisa"];
  poin.forEach((p, i) => {
    const mm = fade(t, 0.8 + i * 0.45, 1.2 + i * 0.45);
    x.save(); x.globalAlpha = m * mm; x.translate((1 - mm) * 20, 0);
    rr(W / 2 - 330, 300 + i * 74, 660, 58, 999); x.fillStyle = "#fff"; x.shadowColor = "rgba(16,40,38,.08)"; x.shadowBlur = 16; x.fill(); x.shadowColor = "transparent";
    bulatNo("✓", W / 2 - 300, 329 + i * 74, 14, C.accent);
    teks(p, W / 2 - 274, 336 + i * 74, { size: 21, weight: 500 });
    x.restore();
  });
  teks("Semua angka di aplikasi adalah data contoh, bukan hasil uji laboratorium.", W / 2, 560, { size: 17, warna: C.subtle, align: "center" });
  x.restore();
}

function kaki(t) {
  // batang kemajuan dan nomor adegan
  rr(56, H - 22, W - 112, 6, 3); x.fillStyle = "rgba(6,104,103,.12)"; x.fill();
  rr(56, H - 22, (W - 112) * Math.min(1, t / TOTAL), 6, 3); x.fillStyle = C.accent; x.fill();
}

function gambar(t) {
  latar();
  const a = ADEGAN.find((s) => t >= s.mulai && t < s.mulai + s.durasi) || ADEGAN[ADEGAN.length - 1];
  const lt = t - a.mulai;
  if (a.jenis === "pembuka") adeganPembuka(a, lt);
  else if (a.jenis === "penutup") adeganPenutup(a, lt);
  else adeganLayar(a, lt);
  kaki(t);
}

async function muatGambar(peta) {
  await Promise.all(Object.entries(peta).map(([k, url]) => new Promise((ok, gagal) => {
    const im = new Image(); im.onload = () => { IMG[k] = im; ok(); }; im.onerror = gagal; im.src = url;
  })));
}

// Pratinjau tanpa suara: gambar bingkai pada detik tertentu.
window.PRATINJAU = async (peta, daftarT) => {
  await muatGambar(peta);
  for (const w of [400, 500, 600, 700]) await document.fonts.load(`${w} 20px ${SANS}`);
  return daftarT.map((t) => { gambar(t); return cv.toDataURL("image/jpeg", 0.8); });
};
window.INFO = () => ADEGAN.map((a) => [a.img || a.jenis, +a.mulai.toFixed(1), +a.durasi.toFixed(1)]);

window.MULAI = async (peta, format = "webm") => {
  await muatGambar(peta);
  await document.fonts.load(`600 20px ${SANS}`); await document.fonts.load(`700 20px ${SANS}`);
  await document.fonts.load(`500 20px ${SANS}`); await document.fonts.load(`400 20px ${SANS}`);
  await document.fonts.ready;
  gambar(0);
  window.POSTER = cv.toDataURL("image/jpeg", 0.86);
  siapkanSuara();
  await ac.resume();
  const stream = new MediaStream([...cv.captureStream(30).getVideoTracks(), ...keluar.stream.getAudioTracks()]);
  const calon = format === "mp4"
    ? ["video/mp4;codecs=avc1.640028,mp4a.40.2", "video/mp4;codecs=avc1.42E01F,mp4a.40.2"]
    : ["video/webm;codecs=vp9,opus", "video/webm;codecs=vp8,opus", "video/webm"];
  const tipe = calon.find((m) => MediaRecorder.isTypeSupported(m));
  if (!tipe) throw new Error(`Peramban ini tidak bisa merekam ${format}`);
  const rec = new MediaRecorder(stream, { mimeType: tipe, videoBitsPerSecond: format === "mp4" ? 1_200_000 : 900_000, audioBitsPerSecond: format === "mp4" ? 128_000 : 96_000 });
  const potongan = [];
  rec.ondataavailable = (e) => e.data.size && potongan.push(e.data);
  const selesai = new Promise((ok) => (rec.onstop = ok));
  // Tangkap poster dari adegan takaran (paling khas).
  const tPoster = ADEGAN[7].mulai + 4.6;
  rec.start(1000);
  const awalAudio = ac.currentTime + 0.05;
  jadwalkanSuara(awalAudio);
  const awal = performance.now() + 50;
  await new Promise((ok) => {
    function bingkai() {
      const t = (performance.now() - awal) / 1000;
      gambar(Math.max(0, t));
      if (!window.POSTER2 && t >= tPoster) window.POSTER2 = cv.toDataURL("image/jpeg", 0.86);
      if (t < TOTAL + 0.3) requestAnimationFrame(bingkai); else ok();
    }
    requestAnimationFrame(bingkai);
  });
  rec.stop();
  await selesai;
  const blob = new Blob(potongan, { type: tipe });
  const buf = new Uint8Array(await blob.arrayBuffer());
  let s = ""; const langkah = 0x8000;
  for (let i = 0; i < buf.length; i += langkah) s += String.fromCharCode.apply(null, buf.subarray(i, i + langkah));
  return { tipe, durasi: TOTAL, data: btoa(s) };
};
</script>
</body>
